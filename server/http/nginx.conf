worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 10;
    client_header_timeout 10;
    client_body_timeout 10;
    client_max_body_size 3m;
    send_timeout 60;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    disable_symlinks on;

    server {
        listen 10.77.0.1:80 default_server;
        server_name 10.77.0.1 www.retro.home.arpa retro.net www.retro.net "";
        root /srv/www;
        index index.html;
        location / {
            limit_except GET { deny all; }
            try_files $uri $uri/ =404;
        }
        location /files/ {
            alias /srv/downloads/;
            autoindex on;
            limit_except GET { deny all; }
        }
        # Hostless browsers can read sites using the numeric address. Keep this
        # user-controlled content off the portal and account origins.
        location /sites/ {
            if ($host != 10.77.0.1) { return 404; }
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8080/legacy/;
            proxy_set_header Host members.retro.net;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
        }
        location ~ /\. { deny all; }
    }
    server {
        listen 10.77.0.1:80;
        server_name files.retro.home.arpa files.retro.net;
        root /srv/downloads;
        autoindex on;
        location / {
            limit_except GET { deny all; }
        }
        location ~ /\. { deny all; }
    }
    server {
        listen 10.77.0.1:80;
        server_name members.retro.net;
        client_body_timeout 120;
        location /public { return 404; }
        location /legacy { return 404; }
        location /healthz { return 404; }
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host members.retro.net;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_read_timeout 60;
        }
    }
    server {
        listen 10.77.0.1:80;
        # Exact infrastructure names above win over this catch-all. The
        # application only serves domains actually claimed by an account.
        server_name ~.;
        location / {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8080/public/$host$request_uri;
            proxy_set_header Host members.retro.net;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
        }
    }
}
