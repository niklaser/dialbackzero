# Dialback Zero mono: both stereo source channels reach the single speaker.
# A two-channel hardware stream is retained for the bcm2835 Headphones device.
# Both outputs carry (L + R) / 2; only PWM0/GPIO12 is wired to the amplifier.
pcm.dialback_zero_mono {
    type route
    slave {
        pcm "hw:CARD=Headphones,DEV=0"
        channels 2
    }
    ttable.0.0 0.5
    ttable.1.0 0.5
    ttable.0.1 0.5
    ttable.1.1 0.5
}

pcm.!default {
    type plug
    slave {
        pcm "dialback_zero_mono"
        channels 2
    }
    # A mono input is duplicated before the averaging matrix, keeping its level.
    route_policy duplicate
}

ctl.!default {
    type hw
    card Headphones
}
