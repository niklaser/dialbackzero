name: Test and build Raspberry Pi image and update

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "software/**"
      - "image/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dialback-zero-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependency
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libasound2-dev

      - name: Compile native modem
        run: make -C software/vendor/tcpser clean all

      - name: Run runtime tests
        run: python3 -m unittest discover -s software/tests -v

      - name: Test Pi hardware configuration
        run: python3 -m unittest discover -s software/hardware -p 'test_*.py' -v

      - name: Run image definition tests
        run: python3 -m unittest discover -s image/tests -v

  build-image:
    name: Raspberry Pi OS Lite 32-bit image and ARMv6 update
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select image version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dev-${GITHUB_SHA:0:12}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Reclaim disposable hosted-runner disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc

      - name: Check build space
        shell: bash
        run: |
          available_kib="$(df --output=avail -k "${GITHUB_WORKSPACE}" | tail -n 1)"
          if (( available_kib < 20 * 1024 * 1024 )); then
            echo "pi-gen needs at least 20 GiB free; this runner has $((available_kib / 1024 / 1024)) GiB" >&2
            exit 1
          fi

      - name: Build image and matching application update with pinned pi-gen
        env:
          DIALBACK_WORK_DIR: ${{ runner.temp }}/dialback-zero-work
          DIALBACK_IMAGE_VERSION: ${{ steps.version.outputs.version }}
          DIALBACK_SOURCE_COMMIT: ${{ github.sha }}
        run: ./image/build.sh

      - name: Upload image, application update, and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dialback-zero-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/dialback-zero-work/releases/image/*.img.xz
            ${{ runner.temp }}/dialback-zero-work/releases/image/*-armv6-update.tar.gz
            ${{ runner.temp }}/dialback-zero-work/releases/image/SHA256SUMS
            ${{ runner.temp }}/dialback-zero-work/releases/image/build-metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish version-tag release
    needs: build-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download built image and application update
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dialback-zero-${{ github.ref_name }}
          path: release-assets

      - name: Attach image and application update to version-tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "Dialback Zero ${GITHUB_REF_NAME}" || gh release view "${GITHUB_REF_NAME}" >/dev/null
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/*.img.xz \
            release-assets/*-armv6-update.tar.gz \
            release-assets/SHA256SUMS \
            release-assets/build-metadata.json --clobber
